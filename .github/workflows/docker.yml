# Build and push two images to ghcr.io/fotohubpl/hydra-nexus. Triggers: a tag v* or a manual dispatch.
#  - slim (Dockerfile target `api`: API + built UI, CPU torch, tesseract, ffmpeg), no weights:
#      tag v1.0.1 -> :1.0.1, :1.0, :latest; dispatch -> :sha-<short> (optionally :latest).
#    Weights once with `docker compose --profile models run --rm models` (pinned revisions + sha256, docs/MODELS.md).
#  - full (target `full` = slim + the 10 pinned models + offline reference data, verified at build time):
#      tag v1.0.1 -> :1.0.1-full, :full; dispatch -> :sha-<short>-full (optionally :full).
#
# Only the docker CLI preinstalled on ubuntu-latest is used (no third-party actions); the layer cache is a
# BuildKit registry cache next to the image (ghcr.io/fotohubpl/hydra-nexus:buildcache). GITHUB_TOKEN with
# packages: write is the only credential.
name: docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      latest:
        description: "Also tag the manual build as :latest"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/fotohubpl/hydra-nexus

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Free runner disk (wheels ~3 GB, slim image ~4.3 GB, full image ~6.7 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/.ghcup || true
          docker system prune -af >/dev/null 2>&1 || true
          df -h /
      - name: Tags
        id: tags
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          LATEST: ${{ inputs.latest }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          tags="-t $IMAGE:sha-$short"
          full="-t $IMAGE:sha-$short-full"
          if [ "$REF_TYPE" = "tag" ]; then
            v="${REF_NAME#v}"
            tags="$tags -t $IMAGE:$v"
            full="$full -t $IMAGE:$v-full"
            case "$v" in *-*) ;; *) tags="$tags -t $IMAGE:${v%.*} -t $IMAGE:latest"; full="$full -t $IMAGE:full";; esac
          elif [ "$LATEST" = "true" ]; then
            tags="$tags -t $IMAGE:latest"
            full="$full -t $IMAGE:full"
          fi
          echo "args=$tags" >> "$GITHUB_OUTPUT"
          echo "full_args=$full" >> "$GITHUB_OUTPUT"
          echo "version=${REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "$tags"
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Build and push (slim)
        env:
          TAG_ARGS: ${{ steps.tags.outputs.args }}
          VERSION: ${{ steps.tags.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx create --name hydra --driver docker-container --use
          # shellcheck disable=SC2086
          docker buildx build . --target api --platform linux/amd64 $TAG_ARGS \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            --label org.opencontainers.image.version="${VERSION}" \
            --label org.opencontainers.image.title="HYDRA NEXUS" \
            --label org.opencontainers.image.description="HYDRA NEXUS: offline scam-ad campaign linking (API + UI). No model weights inside." \
            --cache-from "type=registry,ref=$IMAGE:buildcache" \
            --cache-to "type=registry,ref=$IMAGE:buildcache,mode=max" \
            --provenance=false \
            --push
      - name: Build and push (full = slim + pinned weights + reference data)
        env:
          TAG_ARGS: ${{ steps.tags.outputs.full_args }}
          VERSION: ${{ steps.tags.outputs.version }}
        run: |
          set -euo pipefail
          df -h /
          # shellcheck disable=SC2086
          docker buildx build . --target full --platform linux/amd64 $TAG_ARGS \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            --label org.opencontainers.image.version="${VERSION}-full" \
            --label org.opencontainers.image.title="HYDRA NEXUS (full)" \
            --label org.opencontainers.image.description="HYDRA NEXUS with pinned model weights and offline reference data (licences in /opt/hydra/models/LICENSES)." \
            --cache-from "type=registry,ref=$IMAGE:buildcache" \
            --cache-from "type=registry,ref=$IMAGE:buildcache-full" \
            --cache-to "type=registry,ref=$IMAGE:buildcache-full,mode=max" \
            --provenance=false \
            --push
          docker buildx prune -af >/dev/null 2>&1 || true
          df -h /
      - name: Smoke test the pushed image (imports, CLI, no weights inside)
        run: |
          set -euo pipefail
          ref="$IMAGE:sha-${GITHUB_SHA::7}"
          docker pull "$ref"
          docker run --rm --network none "$ref" hydra --help >/dev/null
          docker run --rm --network none --entrypoint bash "$ref" -c \
            'test -z "$(find / -xdev \( -name "*.safetensors" -o -name "*.onnx" -o -name "*.tflite" -o -name "model.bin" \) -not -path "/opt/venv/*" -not -path "/proc/*" 2>/dev/null)" && echo "no model weights outside site-packages"'
          docker image ls "$IMAGE"
      - name: Smoke test the full image (offline CLI, pinned sha256, smoke tests)
        run: |
          set -euo pipefail
          ref="$IMAGE:sha-${GITHUB_SHA::7}-full"
          docker image rm "$IMAGE:sha-${GITHUB_SHA::7}" >/dev/null 2>&1 || true
          docker pull "$ref"
          docker run --rm --network none "$ref" hydra --help >/dev/null
          docker run --rm --network none -e HYDRA_CACHE_DIR=/opt/hydra/cache --entrypoint bash "$ref" -c \
            'python scripts/pin_check.py /app/models.lock.json /opt/hydra/models/models.lock.json && python scripts/fetch_models.py --verify --lock /opt/hydra/models/models.lock.json && python scripts/reference_data.py status'
          docker image ls "$IMAGE"
