[project]
name = "hydra-nexus"
version = "0.1.0"
description = "HYDRA NEXUS — campaign genomics engine (HackNation 2026). Generic skeleton prepared before the task start; task logic is written from Sat 11:00 (see docs/DISCLOSURE.md)."
requires-python = ">=3.11,<3.12"
# Basic packages (allowed before 11:00 per organiser, Discord #faq 20.11.2026). Licenses: docs/competition/PREPARATION_INVENTORY.md.
dependencies = [
  # API + contracts + CLI
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "python-multipart>=0.0.12",
  "typer>=0.12",
  "orjson>=3.10",
  # media
  "pillow>=11",
  "opencv-python>=4.11",          # NOT opencv-contrib-python: both write cv2/ and scenedetect pulls opencv-python
  "filetype>=1.2",
  "scenedetect>=0.6.4",
  # hashing / similarity
  "imagehash>=4.3",
  "pdqhash>=0.2.8",               # no Linux wheel for 3.11: builds from source (needs g++)
  "numpy>=2.1",
  "scikit-learn>=1.5",
  "datasketch>=1.6",              # 2.x: MinHash(hashvalues=...) needs scheme=
  "networkx>=3.4",                # louvain_communities, leiden_communities, Edmonds branchings (BSD)
  # text / OCR
  "pytesseract>=0.3.13",
  "rapidocr>=3.0",
  "onnxruntime>=1.20",
  # web / infra traces
  "tldextract>=5.1",              # offline: suffix_list_urls=() + cache dir
  "lxml>=5.3",
  # export / integrity
  "stix2>=3.0",
  "cryptography>=43",
  # local models (no external inference APIs)
  "torch>=2.5",
  "transformers>=4.46",
  "sentence-transformers>=3.2",
  "huggingface-hub>=0.26",
  "safetensors>=0.4",
  # generic data / QA (read an unknown organiser dataset, evaluate, report)
  "pandas>=2.2",
  "pyarrow>=18",
  "openpyxl>=3.1",
  "rapidfuzz>=3.10",
  "ftfy>=6.3",
  "confusable-homoglyphs>=3.3",
  "beautifulsoup4>=4.12",
  "matplotlib>=3.9",
  "psutil>=6.1",
  "tqdm>=4.66",                   # MPL-2.0 AND MIT; already a transitive dep of transformers/huggingface-hub
  "graspologic-native>=1.2",
  "anthropic[bedrock]>=0.50",
  "py-tlsh>=4.7",
  "faster-whisper>=1.1",
  "mediapipe>=0.10",
  "c2pa-python>=0.6",
  "schwifty>=2024.1",
  "phonenumbers>=8.13",
  "pyyaml>=6.0",
]

[project.scripts]
hydra = "hydra.cli:app"

[dependency-groups]
dev = [
  "ruff>=0.14",
  "pytest>=8.4",
  "pyright>=1.1.400",
  "httpx>=0.27",
  "pytest-timeout>=2.3",
  "hypothesis>=6.115",            # MPL-2.0, dev/test only, not shipped
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hydra"]

[tool.uv]
# Lock for exactly the two machines we run on.
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
# the Linux server has no GPU: the default PyPI torch drags ~2.5 GB of CUDA libraries.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".claude/worktrees"]  # other agents' in-progress checkouts

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # typer.Argument/Option defaults are the documented pattern

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: end-to-end suite (tests/e2e), real API subprocess; run with `just e2e`"]
